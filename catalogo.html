<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BuildTech - Catálogo completo de componentes de PC. Procesadores, boards, memorias RAM, almacenamiento y más.">
  <title>BuildTech - Catálogo</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/inicio.css">
  <link rel="stylesheet" href="css/catalogo.css">
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header class="header" id="header">
    <div class="container">
      <a href="index.html" class="header__logo">BUILDTECH</a>
      <nav class="header__nav" id="main-nav">
        <a href="index.html" class="header__nav-link">HOME</a>
        <a href="catalogo.html" class="header__nav-link active">CATÁLOGO</a>
        <a href="favoritos.html" class="header__nav-link">FAVORITOS</a>
        <a href="contacto.html" class="header__nav-link">CONTACTO</a>
        <a href="#" class="header__nav-link">BLOG</a>
      </nav>
      <div class="header__actions">
        <a href="favoritos.html" class="header__fav-link" aria-label="Ver favoritos">
          <svg class="header__fav-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="header__fav-badge" id="fav-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- ========== CONTENIDO DEL CATÁLOGO ========== -->
  <main class="catalog" id="catalog">
    <div class="container catalog__layout">
      <!-- Sidebar -->
      <aside class="catalog__sidebar" id="catalog-sidebar">
        <h3 class="catalog__sidebar-title">CATEGORÍAS</h3>
        <ul class="catalog__categories" id="categories-list">
          <!-- Renderizado en JS -->
        </ul>
      </aside>

      <!-- Products Grid -->
      <section class="catalog__main">
        <div class="catalog__header">
          <h1 class="catalog__title section-title--xlarge" id="catalog-title">PROCESADORES</h1>
          <p class="catalog__counter" id="catalog-counter">6 ITEMS CARGADOS / PROCESADORES</p>
        </div>
        <div class="catalog__grid" id="products-grid">
          <!-- Renderizado en JS -->
        </div>
      </section>
    </div>
  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="footer" id="footer">
    <div class="container">
      <div class="footer__brand">
        <span class="footer__logo">BUILDTECH</span>
      </div>
      <div class="footer__col">
        <h4 class="footer__section-title">HOME</h4>
        <a href="catalogo.html" class="footer__link">Catálogo</a>
        <a href="favoritos.html" class="footer__link">Favoritos</a>
        <a href="contacto.html" class="footer__link">Contacto</a>
        <a href="#" class="footer__link">Blog</a>
      </div>
      <div class="footer__col">
        <h4 class="footer__section-title">DESARROLLADORES</h4>
        <span class="footer__link">Junior Mosquera</span>
        <span class="footer__link">Samuel</span>
        <span class="footer__link">Daniel</span>
      </div>
      <div class="footer__col">
        <h4 class="footer__section-title">TECNOLOGIAS</h4>
        <span class="footer__link">HTML5</span>
        <span class="footer__link">Angular</span>
        <span class="footer__link">LocalStorage</span>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
